<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/@webcomponents/custom-elements"></script>
    <script src="https://g200kg.github.io/webaudio-controls/webaudio-controls.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Audiowide"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto+Condensed"
      rel="stylesheet"
    />
    <script src="./webaudio-tinysynth.js"></script>
    <script src="./automation.js"></script>
    <script src="./app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #ddf;
        font-family: "Roboto Condensed", sans-serif;
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        user-select: none;
      }
      #container {
        background: linear-gradient(
          #004 0%,
          #88c 1%,
          #338 2%,
          #226 99%,
          #004 100%
        );
        padding: 5px 30px;
        color: #ccc;
      }
      h1 {
        margin: 0px 0px;
        font-weight: 300;
        font-family: "Audiowide", cursive;
        font-size: 24px;
      }
      #base {
        width: 570px;
        margin: 0 auto;
        background: #000;
        padding: 0px 20px 4px 20px;
        color: #fff;
      }
      td {
        text-align: center;
        padding: 4px;
      }
      td:first-child {
        text-align: left;
      }
      select {
        height: 24px;
      }
      .progsel {
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 4px;
      }
      .prog-controls {
        display: flex;
        gap: 5px;

        > button {
          all: unset;
          background: #aae;
          color: #fff;
          font-size: 12px;
          min-width: 26px;
          height: 22px;
          display: flex;
          justify-content: center;
          align-items: center;
          border: solid 1px #666;
          border-radius: 2px;
          cursor: pointer;
          &:hover {
            opacity: 0.8;
            transition: opacity 0.2s ease-in-out;
          }
        }

        > .random-button {
          margin-left: 2px;
          padding: 0 4px;
        }
      }

      label {
        display: inline-block;
        background: #ddf;
        border: 1px solid #66e;
        width: 70px;
        text-align: center;
        margin: 4px 1px;
        color: #000;
      }
      #kb {
        margin: 14px 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="base">
      <div id="container">
        <table>
          <tr>
            <td><h1 class="title">WebAudio-TinySynth</h1></td>
            <td>Vol</td>
            <td>Reverb</td>
            <td>Quality</td>
          </tr>
          <tr>
            <td>
              <webaudio-tinysynth
                id="tinysynth"
                quality="1"
                loop="1"
                disableDrop="0"
                masterVol="0.3"
              ></webaudio-tinysynth>
            </td>
            <td>
              <webaudio-knob
                colors="#c00;#ccf;#fff"
                diameter="40"
                min="0"
                max="1"
                step="0.01"
                id="vol"
                value="0.5"
                oninput="Ctrl()"
              ></webaudio-knob>
            </td>
            <td>
              <webaudio-knob
                colors="#c00;#ccf;#fff"
                diameter="40"
                min="0"
                max="1"
                step="0.01"
                id="rev"
                value="0.2"
                oninput="Ctrl()"
              ></webaudio-knob>
            </td>
            <td>
              <select onchange="SetQuality(this.selectedIndex)">
                <option>Q:0</option>
                <option selected>Q:1</option>
              </select>
            </td>
          </tr>
        </table>
        <div class="progsel">
          <div>Program:</div>
          <div class="prog-controls">
            <select
              id="prog"
              onchange="ProgChange(this.selectedIndex)"
            ></select>
            <button type="button" onclick="ProgShift(-1)">◀</button>
            <button type="button" onclick="ProgShift(1)">▶</button>
            <button type="button" class="random-button" onclick="ProgRandom()">
              Random
            </button>
          </div>
        </div>
        <webaudio-keyboard id="kb" min="48" width="470"></webaudio-keyboard>
      </div>
    </div>
  </body>
</html>
