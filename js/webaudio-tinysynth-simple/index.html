<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/@webcomponents/custom-elements"></script>
    <script src="https://g200kg.github.io/webaudio-controls/webaudio-controls.js"></script>
    <link
      href="https://fonts.googleapis.com/css?family=Audiowide"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto+Condensed"
      rel="stylesheet"
    />
    <script src="./webaudio-tinysynth.js"></script>
    <script src="./app.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #ddf;
        font-family: "Roboto Condensed", sans-serif;
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        user-select: none;
      }
      #container {
        background: #333;
        background: linear-gradient(
          #000 0%,
          #888 1%,
          #333 2%,
          #222 99%,
          #000 100%
        );
        background: linear-gradient(
          #004 0%,
          #88c 1%,
          #338 2%,
          #226 99%,
          #004 100%
        );
        padding: 5px 30px;
        color: #ccc;
      }
      h1 {
        margin: 0px 0px;
        font-weight: 300;
        font-family: "Audiowide", cursive;
        font-size: 24px;
      }
      #base {
        width: 570px;
        margin: 0 auto;
        background: #000;
        padding: 0px 20px 4px 20px;
        color: #fff;
      }
      td {
        text-align: center;
        padding: 4px;
      }
      td:first-child {
        text-align: left;
      }
      .progsel {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 4px;
      }
      select {
        height: 24px;
      }
      label {
        display: inline-block;
        background: #ddf;
        border: 1px solid #66e;
        width: 70px;
        text-align: center;
        margin: 4px 1px;
        color: #000;
      }
      #kb {
        margin: 12px 0 8px;
      }
    </style>
  </head>
  <body>
    <div id="base">
      <div id="container">
        <table>
          <tr>
            <td><h1 class="title">WebAudio-TinySynth</h1></td>
            <td>Vol</td>
            <td>Reverb</td>
            <td>Quality</td>
          </tr>
          <tr>
            <td>
              <webaudio-tinysynth
                id="tinysynth"
                quality="1"
                loop="1"
                disableDrop="0"
                masterVol="0.3"
              ></webaudio-tinysynth>
            </td>
            <td>
              <webaudio-knob
                colors="#c00;#ccf;#fff"
                diameter="40"
                min="0"
                max="1"
                step="0.01"
                id="vol"
                value="0.5"
                oninput="Ctrl()"
              ></webaudio-knob>
            </td>
            <td>
              <webaudio-knob
                colors="#c00;#ccf;#fff"
                diameter="40"
                min="0"
                max="1"
                step="0.01"
                id="rev"
                value="0.2"
                oninput="Ctrl()"
              ></webaudio-knob>
            </td>
            <td>
              <select onchange="SetQuality(this.selectedIndex)">
                <option>Q:0</option>
                <option selected>Q:1</option>
              </select>
            </td>
          </tr>
        </table>
        <div class="progsel">
          <div>Program:</div>
          <select id="prog" onchange="ProgChange(this.selectedIndex)"></select>
        </div>
        <webaudio-keyboard
          id="kb"
          min="48"
          width="470"
          tabindex="1"
        ></webaudio-keyboard>
      </div>
    </div>
  </body>
</html>
